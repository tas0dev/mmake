[package]
name = "mmake"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mmake"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
globset = "0.4"
walkdir = "2"
num_cpus = "1"
crossterm = "0.29"

